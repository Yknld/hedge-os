<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hedge OS Bridge</title>
<style>
:root{color-scheme:dark;--canvas:#090c10;--surface:#0d1117;--line:#252c36;--text:#dce4ee;--muted:#788395;--green:#34d399;--amber:#fbbf24;--red:#fb7185}*{box-sizing:border-box}body{width:380px;margin:0;background:var(--canvas);color:var(--text);font:12px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface)}h1{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.header-actions{display:flex;align-items:center;gap:9px}.version{font:10px ui-monospace,SFMono-Regular,monospace;color:var(--muted)}.refresh{border:1px solid var(--line);background:transparent;padding:4px 7px;color:#9aa6b7;font:8px ui-monospace,SFMono-Regular,monospace;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}.refresh:hover{border-color:#4b5563;background:#161c24;color:#fff}.refresh:disabled{cursor:wait;opacity:.55}main{padding:12px}.summary{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--line);background:var(--surface)}.summary strong{font-size:12px}.summary span:last-child{margin-left:auto;color:var(--muted);font:9px ui-monospace,SFMono-Regular,monospace;text-transform:uppercase;letter-spacing:.12em}section{margin-top:10px;border:1px solid var(--line);background:var(--surface)}.section-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}h2{margin:0;font-size:9px;color:#9aa6b7;letter-spacing:.18em;text-transform:uppercase}.count{font:9px ui-monospace,SFMono-Regular,monospace;color:var(--muted)}.row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:9px;align-items:center;min-height:48px;padding:9px 12px;border-top:1px solid rgba(37,44,54,.65)}.row:first-child{border-top:0}.primary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}.secondary{margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font:9px ui-monospace,SFMono-Regular,monospace}.badge{border:1px solid var(--line);padding:3px 6px;color:var(--muted);font:8px ui-monospace,SFMono-Regular,monospace;text-transform:uppercase}.badge.ready{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08);color:var(--green)}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 3px rgba(120,131,149,.08)}.dot.green{background:var(--green);box-shadow:0 0 0 3px rgba(52,211,153,.1)}.dot.yellow{background:var(--amber);box-shadow:0 0 0 3px rgba(251,191,36,.1)}.dot.red{background:var(--red);box-shadow:0 0 0 3px rgba(251,113,133,.1)}.empty{padding:14px 12px;color:var(--muted)}#error{display:none;margin-top:10px;border:1px solid rgba(251,113,133,.3);background:rgba(251,113,133,.08);padding:9px 10px;color:#fda4af;font-size:10px;overflow-wrap:anywhere}#error:not(:empty){display:block}
</style><link rel="stylesheet" href="popup-theme.css"></head><body>
<header><h1>Execution bridge</h1><div class="header-actions"><span id="version" class="version">—</span></div></header>
<main><div class="summary"><i id="appDot" class="dot yellow"></i><strong id="appValue">Connecting to app</strong><span>Local relay</span></div><section><div class="section-head"><h2>TradingView · Prop</h2><span id="tvCount" class="count">0 tabs</span></div><div id="tvTabs"><div class="empty">Checking TradingView tabs…</div></div></section><section><div class="section-head"><h2>Ironbeam · Hedge</h2><span id="ibCount" class="count">0 tabs</span></div><div id="ibTabs"><div class="empty">Checking Ironbeam tabs…</div></div></section><div id="error" role="status" aria-live="polite"></div></main><script src="popup.js"></script></body></html>
