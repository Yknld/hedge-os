[package]
name = "paired-execution-terminal"
version = "0.1.0"
description = "Local-first paired trade execution terminal"
authors = ["Vector"]
edition = "2021"

[lib]
name = "paired_execution_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
